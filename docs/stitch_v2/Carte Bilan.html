  <script>
    (function () {
      try {
        const pseudo = localStorage.getItem('renovo-card-pseudo');
        const showEmail = localStorage.getItem('renovo-card-show-email') === 'true';
        if (pseudo) {
          document.getElementById('card-pseudo').textContent = pseudo;
          const parts = pseudo.trim().split(/\s+/);
          const initials = parts.length >= 2
            ? (parts[0][0] + parts[1][0]).toUpperCase()
            : pseudo.slice(0, 2).toUpperCase();
          document.getElementById('card-initials').textContent = initials;
        }
        if (showEmail) {
          document.getElementById('card-subtitle').textContent = 'crepin.houessou@gmail.com';
        }
      } catch (e) {}
