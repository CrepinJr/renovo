  <script>
    (function () {
      const root = document.documentElement;
      try {
        if (localStorage.getItem('renovo-theme') === 'dark') {
          root.classList.add('dark');
        }
      } catch (e) {}

      // Calendar & 3-week Saturday planner state
      const MONTHS_FR = [
        'Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
        'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'
      ];
      const MONTHS_LOWER_FR = [
        'janvier', 'février', 'mars', 'avril', 'mai', 'juin',
        'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'
      ];
      const DAYS_FR = [
        'Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'
      ];

      // Completed dates (ISO YYYY-MM-DD): Oct 31, Nov 21; Missed >72h: Dec 5; Predicted: Dec 12, Jan 2
      const completedDates = new Set(['2026-10-31', '2026-11-21']);
      const missedDates = new Set(['2026-12-05', '2026-10-10']);
      const predictedDates = new Set(['2026-12-12', '2027-01-02']);

      let viewYear = 2026;
      let viewMonth = 11; // 0-indexed: 11 = Décembre
      let selectedISO = '2026-12-12';

      const monthLabelEl = document.getElementById('month-label');
      const gridEl = document.getElementById('calendar-grid');
      const detailDateEl = document.getElementById('detail-date');
      const detailStatusPill = document.getElementById('detail-status-pill');
      const detailStatusDot = document.getElementById('detail-status-dot');
      const detailStatusText = document.getElementById('detail-status-text');
      const detailHelperEl = document.getElementById('detail-helper');
      const markBtn = document.getElementById('mark-completed-btn');
      const markBtnLabel = document.getElementById('mark-btn-label');

      function toISO(y, m, d) {
        return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      }

      function formatFrenchDate(iso) {
        const [y, m, d] = iso.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        const dayName = DAYS_FR[dateObj.getDay()];
        return dayName + ' ' + d + ' ' + MONTHS_LOWER_FR[m - 1] + ' ' + y;
      }

      function renderDetail() {
        detailDateEl.textContent = formatFrenchDate(selectedISO);
        if (completedDates.has(selectedISO)) {
          detailStatusPill.className = 'inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-xs rounded-full bg-sage-tint text-on-sage-tint font-label text-label-md';
          detailStatusDot.className = 'w-2 h-2 rounded-full bg-sage-emerald';
          detailStatusText.textContent = 'Confession effectuée';
          detailHelperEl.textContent = 'Enregistrée dans votre suivi personnel';
          markBtnLabel.textContent = 'Enregistrée';
          markBtn.disabled = true;
          markBtn.classList.add('opacity-50', 'cursor-not-allowed');
        } else if (missedDates.has(selectedISO)) {
          detailStatusPill.className = 'inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-xs rounded-full bg-light-surface-container-low dark:bg-dark-surface-container-low border border-light-outline dark:border-dark-outline text-light-on-surface-variant dark:text-dark-on-surface-variant font-label text-label-md';
          detailStatusDot.className = 'w-2 h-2 rounded-full bg-light-on-surface-variant/60 dark:bg-dark-on-surface-variant/60';
          detailStatusText.textContent = 'Échéance non effectuée (délai de 72h dépassé)';
          detailHelperEl.textContent = 'Vous pouvez enregistrer cette confession à tout moment';
          markBtnLabel.textContent = 'Marquer comme effectuée';
          markBtn.disabled = false;
          markBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        } else if (predictedDates.has(selectedISO)) {
          detailStatusPill.className = 'inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-xs rounded-full bg-gold-tint text-on-gold-tint font-label text-label-md';
          detailStatusDot.className = 'w-2 h-2 rounded-full bg-antique-gold';
          detailStatusText.textContent = 'Prochaine confession prévue';
          detailHelperEl.textContent = 'Rythme automatique de 3 semaines';
          markBtnLabel.textContent = 'Marquer comme effectuée';
          markBtn.disabled = false;
          markBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        } else {
          detailStatusPill.className = 'inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-xs rounded-full bg-light-surface-container-low dark:bg-dark-surface-container-low text-light-on-surface-variant dark:text-dark-on-surface-variant font-label text-label-md';
          detailStatusDot.className = 'w-2 h-2 rounded-full bg-light-on-surface-variant dark:bg-dark-on-surface-variant';
          detailStatusText.textContent = 'Aucune confession enregistrée';
          detailHelperEl.textContent = 'Rythme automatique de 3 semaines';
          markBtnLabel.textContent = 'Marquer comme effectuée';
          markBtn.disabled = false;
          markBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
      }

      function renderCalendar() {
        monthLabelEl.textContent = MONTHS_FR[viewMonth] + ' ' + viewYear;
        gridEl.innerHTML = '';

        const firstDay = new Date(viewYear, viewMonth, 1);
        // Monday-first offset (0 = Mon ... 6 = Sun)
        const startOffset = (firstDay.getDay() + 6) % 7;
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

        for (let i = 0; i < startOffset; i++) {
          const emptyCell = document.createElement('div');
          emptyCell.className = 'h-11';
          gridEl.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const iso = toISO(viewYear, viewMonth, day);
          const isSelected = iso === selectedISO;
          const isCompleted = completedDates.has(iso);
          const isMissed = missedDates.has(iso);
          const isPredicted = predictedDates.has(iso);

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('aria-label', formatFrenchDate(iso));
          btn.className = 'h-11 flex flex-col items-center justify-center gap-1 rounded-md transition-colors duration-state-change ease-state-change focus:outline-none ' +
            (isSelected
              ? 'bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary'
              : isPredicted
                ? 'ring-1 ring-antique-gold text-light-on-surface dark:text-dark-on-surface hover:bg-light-surface-container-low dark:hover:bg-dark-surface-container-low'
                : isMissed
                  ? 'ring-1 ring-light-on-surface-variant/35 dark:ring-dark-on-surface-variant/35 text-light-on-surface-variant dark:text-dark-on-surface-variant hover:bg-light-surface-container-low dark:hover:bg-dark-surface-container-low'
                  : 'text-light-on-surface dark:text-dark-on-surface hover:bg-light-surface-container-low dark:hover:bg-dark-surface-container-low');

          const numSpan = document.createElement('span');
          numSpan.className = 'font-body text-body-md leading-none';
          numSpan.setAttribute('data-design-text-token', 'body-md');
          numSpan.textContent = String(day);
          btn.appendChild(numSpan);

          const dot = document.createElement('span');
          if (isCompleted) {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-sage-emerald';
          } else if (isPredicted) {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-antique-gold';
          } else if (isMissed) {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-light-on-surface-variant/60 dark:bg-dark-on-surface-variant/60';
          } else {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-transparent';
          }
          btn.appendChild(dot);

          btn.addEventListener('click', function () {
            selectedISO = iso;
            renderCalendar();
            renderDetail();
          });

          gridEl.appendChild(btn);
        }
      }

      document.getElementById('prev-month').addEventListener('click', function () {
        viewMonth--;
        if (viewMonth < 0) {
          viewMonth = 11;
          viewYear--;
        }
        renderCalendar();
      });

      document.getElementById('next-month').addEventListener('click', function () {
        viewMonth++;
        if (viewMonth > 11) {
          viewMonth = 0;
          viewYear++;
        }
        renderCalendar();
      });

      document.getElementById('today-btn').addEventListener('click', function () {
        viewYear = 2026;
        viewMonth = 11;
        selectedISO = '2026-12-12';
        renderCalendar();
        renderDetail();
      });

      markBtn.addEventListener('click', function () {
        completedDates.add(selectedISO);
        predictedDates.delete(selectedISO);
        missedDates.delete(selectedISO);
        renderCalendar();
        renderDetail();
      });

      renderCalendar();
      renderDetail();
    })();
  </script>


</body></html>
