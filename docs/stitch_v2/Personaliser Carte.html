<body class="bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface font-body antialiased transition-colors duration-surface-enter ease-surface-enter">
  <div class="min-h-[884px] w-full max-w-[390px] mx-auto relative flex flex-col justify-end overflow-hidden" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Quiet Underlying Account & Bilan Context -->
    <div aria-hidden="true" class="px-page-margin pt-gutter-lg flex flex-col gap-gutter-lg pointer-events-none select-none">
      <div class="flex items-center justify-between pt-gutter-xs">
        <div class="flex items-center gap-gutter-sm">
          <span class="w-9 h-9 rounded-full bg-light-surface-container dark:bg-dark-surface-container border border-light-outline dark:border-dark-outline"></span>
          <span class="w-36 h-6 rounded-md bg-light-surface-container-low dark:bg-dark-surface-container-low"></span>
        </div>
        <span class="w-9 h-9 rounded-full bg-light-surface-container dark:bg-dark-surface-container border border-light-outline dark:border-dark-outline"></span>
      </div>
      <div class="bg-light-surface-container dark:bg-dark-surface-container border border-light-outline dark:border-dark-outline rounded-xl p-gutter-xl h-48 flex flex-col gap-gutter-md">
        <span class="w-32 h-6 rounded-md bg-light-surface-container-low dark:bg-dark-surface-container-low"></span>
        <span class="w-full h-24 rounded-md bg-light-surface-container-low dark:bg-dark-surface-container-low"></span>
      </div>
    </div>

    <!-- Scrim Overlay -->
    <div class="fixed inset-0 max-w-[390px] mx-auto bg-obsidian/35 z-10 pointer-events-none"></div>

    <!-- Bottom Sheet Modal (24px top corners, Alabaster / Obsidian ground) -->
    <section role="dialog" aria-modal="true" aria-labelledby="customize-title" class="relative z-20 w-full bg-light-surface dark:bg-dark-surface border-t border-x border-light-outline dark:border-dark-outline rounded-t-2xl px-page-margin pt-gutter-md pb-section shadow-xl flex flex-col gap-gutter-lg">
      <!-- Drag Handle -->
      <div class="flex justify-center w-full">
        <span class="w-10 h-1 rounded-full bg-light-outline dark:bg-dark-outline" aria-hidden="true"></span>
      </div>

      <!-- Header -->
      <header class="flex items-center justify-between">
        <h1 id="customize-title" class="font-headline text-headline-md text-light-on-surface dark:text-dark-on-surface" data-design-text-token="headline-md">
          Personnaliser la carte
        </h1>
        <a href="../account-sync/AccountCloudBackup.html" aria-label="Fermer" class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-light-surface-container dark:bg-dark-surface-container border border-light-outline dark:border-dark-outline text-light-on-surface-variant dark:text-dark-on-surface-variant hover:text-light-on-surface dark:hover:text-dark-on-surface transition-colors duration-state-change ease-state-change">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">close</span>
        </a>
      </header>

      <!-- Discreet Visual Reminder Row (Gold-ringed Avatar + Selected Year) -->
      <div class="flex items-center gap-gutter-md px-gutter-md py-gutter-sm rounded-md bg-light-surface-container dark:bg-dark-surface-container border border-light-outline dark:border-dark-outline">
        <div class="w-10 h-10 rounded-full ring-2 ring-antique-gold bg-liturgical-indigo flex items-center justify-center font-headline text-label-md text-alabaster shrink-0">
          <span data-design-text-token="label-md">CJ</span>
        </div>
        <div class="flex flex-col min-w-0">
          <span class="font-title text-body-md font-semibold text-light-on-surface dark:text-dark-on-surface" data-design-text-token="body-md">Bilan annuel 2026</span>
          <span id="preview-caption" class="font-body text-body-sm text-light-on-surface-variant dark:text-dark-on-surface-variant truncate" data-design-text-token="body-sm">Parcours spirituel • Renovo</span>
        </div>
      </div>

      <!-- Form Controls -->
      <form id="customize-form" class="flex flex-col gap-gutter-lg" action="../../html/BilanSpirituelAnnuelCard.html" method="get">

        <!-- Pseudo Text Field -->
        <label data-component-id="input-field-icon" data-component-type="input-field" data-component-variant="with-icon" class="w-full flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface-variant dark:text-dark-on-surface-variant">
            Pseudo affiché sur la carte
          </span>
          <div class="relative flex items-center">
            <span aria-hidden="true" class="material-symbols-outlined text-[18px] text-light-on-surface-variant dark:text-dark-on-surface-variant absolute left-gutter-md pointer-events-none">badge</span>
            <input id="pseudo-input" type="text" value="Crépin Junior" placeholder="Surnom ou devise personnelle" class="w-full pl-10 pr-gutter-lg py-gutter-md rounded-md bg-light-surface-container dark:bg-dark-surface-container border border-light-outline dark:border-dark-outline text-light-on-surface dark:text-dark-on-surface placeholder:text-light-on-surface-variant dark:placeholder:text-dark-on-surface-variant font-body text-body-md focus:border-light-primary dark:focus:border-dark-primary focus:ring-0">
          </div>
        </label>

        <!-- Privacy Toggle Row (OFF by default) -->
        <div class="flex items-center justify-between gap-gutter-md px-gutter-md py-gutter-md rounded-md bg-light-surface-container dark:bg-dark-surface-container border border-light-outline dark:border-dark-outline">
          <div class="flex flex-col gap-0.5 min-w-0">
            <span class="font-label text-label-lg text-light-on-surface dark:text-dark-on-surface" data-design-text-token="label-lg">
              Afficher mon adresse e-mail
            </span>
            <span class="font-body text-body-sm text-light-on-surface-variant dark:text-dark-on-surface-variant text-pretty" data-design-text-token="body-sm">
              Masquée par défaut pour préserver votre confidentialité
            </span>
          </div>
          <button id="email-switch" type="button" role="switch" aria-checked="false" aria-label="Afficher mon adresse e-mail" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-light-outline dark:bg-dark-outline transition-colors duration-state-change ease-state-change focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary dark:focus-visible:outline-dark-primary">
            <span id="email-switch-thumb" aria-hidden="true" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-light-surface-container dark:bg-dark-surface-container shadow-sm transition-transform duration-state-change ease-state-change translate-x-0"></span>
          </button>
        </div>

        <!-- Primary Action Button -->
        <button id="generate-share-btn" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-gutter-sm px-gutter-xl py-gutter-md rounded-md bg-liturgical-indigo text-on-liturgical-indigo font-label text-label-lg transition-opacity duration-state-change ease-state-change hover:opacity-90 active:opacity-80">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">share</span>
          <span data-design-text-token="label-lg">Générer et partager</span>
        </button>

      </form>
    </section>

  </div>

  <script>
    (function () {
      try {
        if (localStorage.getItem('renovo-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}

      const switchBtn = document.getElementById('email-switch');
      const switchThumb = document.getElementById('email-switch-thumb');
      const previewCaption = document.getElementById('preview-caption');
      const pseudoInput = document.getElementById('pseudo-input');
      let showEmail = false;

      switchBtn.addEventListener('click', function () {
        showEmail = !showEmail;
        switchBtn.setAttribute('aria-checked', showEmail ? 'true' : 'false');
        if (showEmail) {
          switchBtn.classList.remove('bg-light-outline', 'dark:bg-dark-outline');
          switchBtn.classList.add('bg-liturgical-indigo');
          switchThumb.classList.remove('translate-x-0');
          switchThumb.classList.add('translate-x-5');
          previewCaption.textContent = 'crepin.houessou@gmail.com';
        } else {
          switchBtn.classList.remove('bg-liturgical-indigo');
          switchBtn.classList.add('bg-light-outline', 'dark:bg-dark-outline');
          switchThumb.classList.remove('translate-x-5');
          switchThumb.classList.add('translate-x-0');
          previewCaption.textContent = 'Parcours spirituel • Renovo';
        }
      });

      document.getElementById('customize-form').addEventListener('submit', function () {
        try {
          localStorage.setItem('renovo-card-pseudo', pseudoInput.value.trim() || 'Crépin Junior');
          localStorage.setItem('renovo-card-show-email', showEmail ? 'true' : 'false');
        } catch (e) {}
      });
    })();
  </script>
